name: Build Container Images

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      registry:
        description: 'Container registry to push to'
        required: false
        type: choice
        options:
          - quay.io
          - ghcr.io
  schedule:
    # Run nightly at 2:00 AM Eastern (7:00 AM UTC)
    - cron: '0 7 * * *'

permissions:
  packages: write

jobs:
  build-images:
    name: Build ${{ matrix.desktop }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      matrix:
        desktop: [kinoite, silverblue]
        arch: [x86_64, aarch64]
      fail-fast: false
    env:
      REGISTRY: ${{ inputs.registry || 'quay.io' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          # Remove unnecessary packages to free up space
          sudo apt-get clean
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          df -h

      - name: Install podman with heredoc support
        # The stock Ubuntu podman (4.9.3) mishandles Containerfile heredocs: it
        # treats the heredoc body as build instructions. Install a recent static
        # podman (v5.6.2) so mybox/Containerfile's `RUN <<EORUN` blocks parse.
        # Podman is also used instead of docker because the Kinoite base image
        # (~257 layers) exceeds docker's overlay2 max depth of 128.
        run: |
          sudo bash .github/utils/install-podman.sh
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor,
          # which makes rootless podman fail with "failed to reexec: Permission
          # denied". Relax the restriction; also extend the distro profile
          # (which covers /usr/bin/podman) to the static /usr/local/bin/podman.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if [ -f /etc/apparmor.d/podman ]; then
            sudo sed -Ei 's!^profile podman /usr/bin/podman !profile podman /usr/{bin,local/bin}/podman !' /etc/apparmor.d/podman
            sudo apparmor_parser -r /etc/apparmor.d/podman || true
          fi
          # Rootless podman needs a subuid/subgid range for the current user.
          user="$(id -un)"
          grep -q "^${user}:" /etc/subuid || echo "${user}:100000:65536" | sudo tee -a /etc/subuid
          grep -q "^${user}:" /etc/subgid || echo "${user}:100000:65536" | sudo tee -a /etc/subgid
          # The static bundle installs to /usr/local/bin; make sure it wins over
          # the distro podman in /usr/bin for the remaining steps.
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Login to GHCR
        if: env.REGISTRY == 'ghcr.io'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            podman login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Login to Quay.io
        if: env.REGISTRY == 'quay.io'
        run: |
          echo "${{ secrets.QUAY_AUTH }}" | base64 -d | awk -F: '{print $2}' | \
            podman login quay.io \
              -u $(echo "${{ secrets.QUAY_AUTH }}" | base64 -d | awk -F: '{print $1}') --password-stdin

      - name: Build image
        run: |
          make build-mybox \
            DESKTOP=${{ matrix.desktop }} \
            CONTAINER_RUNTIME=podman \
            MYBOX_IMAGE=${{ env.REGISTRY }}/shanemcd/mybox

      - name: Show image info
        run: |
          podman images | grep mybox

      - name: Push image
        run: |
          make push-mybox \
            DESKTOP=${{ matrix.desktop }} \
            CONTAINER_RUNTIME=podman \
            MYBOX_IMAGE=${{ env.REGISTRY }}/shanemcd/mybox

      - name: Save image size info
        run: |
          echo "## Build Summary - ${{ matrix.desktop }} (${{ matrix.arch }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          podman images --format "{{.Repository}}:{{.Tag}} {{.Size}} {{.CreatedAt}}" | grep mybox >> $GITHUB_STEP_SUMMARY || true
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Images pushed to ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
